name: E2E

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js 22
      uses: actions/setup-node@v6
      with:
        node-version: 22
    - name: Configure private registry auth
      run: |
        echo '@audemarspiguet:registry=https://git.idweaver.com/api/v4/packages/npm/' > .npmrc
        echo '//git.idweaver.com/api/v4/packages/npm/:_authToken=${GITLAB_PAT}' >> .npmrc
    - name: Install dependencies
      run: npm ci
      env:
        GITLAB_PAT: ${{ secrets.GITLAB_PAT }}
    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium
    - name: Start local AEM dev server
      run: npx --yes @adobe/aem-cli up &
    - name: Wait for local server
      # http-get:// forces a GET check — this dev server 502s on wait-on's
      # default HEAD request.
      run: npx --yes wait-on "http-get://localhost:3000" --timeout 60000
    - name: Run Playwright tests
      run: npx playwright test
    - name: Upload Playwright report
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 14
