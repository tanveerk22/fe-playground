name: Lighthouse

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js 22
      uses: actions/setup-node@v6
      with:
        node-version: 22
    - name: Generate Lighthouse CI config
      run: node tools/scripts/generate-lighthouserc.mjs
    - name: Run Lighthouse CI
      run: npx --yes @lhci/cli@0.15.x autorun --config=./lighthouserc.generated.json
    - name: Upload Lighthouse report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lighthouse-report
        path: .lighthouseci/
        retention-days: 14
