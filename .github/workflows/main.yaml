name: Build
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js 20
      uses: actions/setup-node@v6
      with:
        node-version: 22
    - name: Install dependencies
      run: npm ci
    - run: npm run lint
    - run: npm run test:coverage
    - run: npm run check:size-budget
