name: Build design tokens

# Runs whenever the design-tokens package version changes on any branch
# except main. Vendors the CSS built by the published
# @audemarspiguet/design-tokens package into styles/tokens/, fails the job
# if the new version introduces a custom-property name that collides with
# styles/styles.css (see docs/design-tokens-poc.md), and otherwise commits
# the result back to the same branch so branch previews reflect it.
#
# Requires a GITLAB_PAT repo secret: a GitLab personal access token
# (scope: read_api or read_package_registry) for git.idweaver.com, with
# read access to the audemarspiguet/ap-design-system project.

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

jobs:
  build-tokens:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure private registry auth
        run: |
          echo '@audemarspiguet:registry=https://git.idweaver.com/api/v4/packages/npm/' > .npmrc
          echo '//git.idweaver.com/api/v4/packages/npm/:_authToken=${GITLAB_PAT}' >> .npmrc

      - name: Install dependencies
        run: npm ci
        env:
          GITLAB_PAT: ${{ secrets.GITLAB_PAT }}

      - name: Sync design-token CSS from the installed package
        run: npm run build:tokens

      - name: Guard against naming collisions with styles.css
        run: npm run check:token-collisions

      - name: Commit generated CSS if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add styles/tokens
          if ! git diff --cached --quiet; then
            git commit -m "chore: resync design-token CSS from @audemarspiguet/design-tokens [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes to generated design-token CSS."
          fi
